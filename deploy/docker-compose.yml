# Full-stack deployment for the投研 Agent platform (T1.10 baseline, T3.8 wiring).
#
# Start the stack (see deploy/README.md for the full runbook):
#
#   cd deploy && docker compose --env-file ../.env up -d --build
#
# Notes
# - The public port is 8080 by default. Set web.port in config/config.yaml to
#   change it; the API stays unexposed and is reachable only through Caddy.
# - SSE requires the proxy hop to stay unbuffered. That is configured in
#   deploy/Caddyfile (flush_interval -1), not in the app.
# - Prefer running this over plain `python -m server.main`; the sandbox backend
#   needs the privileges configured on the api service below.

services:
  # ── Frontend bundle ─────────────────────────────────────────────
  # Builds the Vite bundle and publishes it into the shared `web_dist` volume,
  # then exits. Caddy waits for it (service_completed_successfully) so the site
  # never comes up serving an empty directory.
  frontend:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    volumes:
      - web_dist:/srv/web
    restart: "no"

  # ── Edge: static bundle + streaming reverse proxy ───────────────
  caddy:
    profiles: ["full"]
    image: caddy:2-alpine
    container_name: ${CONTAINER_PREFIX}-caddy
    restart: unless-stopped
    # F19/T8: Caddy proxies /api and the SSE stream, so it must not accept
    # traffic while the API is storage-unready (schema behind / data root
    # unwritable). The api healthcheck below gates on /readyz, not /healthz.
    depends_on:
      frontend:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      # Host:container. The container listens on 80 (plain) and 443 (TLS);
      # publishing 80/443 would collide with anything already on the host, so
      # map a high port here and terminate TLS in front of it if needed.
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    environment:
      # A real hostname gets an automatically renewed public certificate.
      # Left unset it defaults to `localhost` (self-signed, fine for a laptop).
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - web_dist:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── API / agent engine ──────────────────────────────────────────
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      target: runtime
    container_name: ${CONTAINER_PREFIX}-api
    restart: unless-stopped
    environment:
      FRONTIER_AGENT_ALLOW_PRIVATE_HOSTS: "true"
      FRONTIER_AGENT_CONFIG: /app/config/config.yaml
      FRONTIER_AGENT_ENV: /app/.env
      # Corpus DB：容器内 localhost 指向容器自身，必须显式指向宿主 / 服务地址。
      # 用 CORPUS_DSN_DOCKER 覆盖；默认走 Docker Desktop 宿主网关。本机 CLI 读
      # ../.env 的 CORPUS_DSN，不受此项影响。
      CORPUS_DSN: ${CORPUS_DSN_DOCKER:-postgresql://postgres:postgres@host.docker.internal:5432/postgres}
      # 业务库：与 CORPUS_DSN 同理——容器内 localhost 指向容器自身，必须显式指向宿主，
      # 否则 server/config.py 从挂载的 ../.env 读到 `localhost:5432/apodex`，容器起不到
      # 可用状态（实测 /healthz = 503 storage_unavailable）。用 SERVER_DATABASE_URL_DOCKER
      # 覆盖；scheme 必须是 +asyncpg。库名与语料库不同：业务 apodex、语料 postgres。
      SERVER_DATABASE_URL: ${SERVER_DATABASE_URL_DOCKER:-postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/apodex}
      # F01: run data (trajectories / inputs / outputs / spill) lives outside the
      # source tree, on the named volume mounted below — never in the image.
      SERVER_RUNS_ROOT: /var/lib/frontier-agent/web/runs
    ports:
      # API is published only to aid debugging; Caddy is the supported path.
      - ${API_DEBUG_PORT:-8000}:8000
    # F19: health gates on /readyz (database + schema version + run-data root),
    # NOT /healthz — a storage-unready API must not report healthy. Consumers
    # (orchestrators, `depends_on: condition: service_healthy`) key off this.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ../config:/app/config:ro
      - ../.env:/app/.env:ro
      - ../data:/app/data
      # F01: the run-data volume mounts at the source-tree-external root the API
      # is configured to write to. Keep the `agent_data` name so an existing
      # volume keeps its identity rather than being replaced by a new one.
      - agent_data:/var/lib/frontier-agent/web
    working_dir: /app
    # Bubblewrap user namespaces need these; see the Dockerfile notes.
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_PTRACE
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  web_dist:
  agent_data:
  caddy_data:
  caddy_config:
