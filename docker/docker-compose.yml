# 语料库 PostgreSQL 服务（Windows Docker Desktop / Linux 通用）
#
# 构建并启动：
#   docker compose build
#   docker compose up -d
#
# 连接串（WSL2 / Windows 本机均可用 localhost，因 WSL2 localhost 转发到 Windows 宿主）：
#   postgresql://postgres:postgres@localhost:5432/postgres
services:
  corpus-db:
    build:
      context: .
      dockerfile: Dockerfile.corpus-db
    container_name: corpus-db
    environment:
      POSTGRES_DB: ${CORPUS_DB_NAME:-postgres}
      POSTGRES_USER: ${CORPUS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CORPUS_DB_PASSWORD:-postgres}
    ports:
      # 宿主端口可用 CORPUS_DB_PORT 覆盖；须与 .env 的 CORPUS_DSN 一致。
      - "${CORPUS_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
